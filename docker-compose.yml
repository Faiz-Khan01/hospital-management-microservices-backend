networks:
  hospital-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local

services:
  # ==========================================
  # DATABASE: MySQL 8.0
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: hospital-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pPassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hospital-network

  # ==========================================
  # CACHE: Redis 7
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: hospital-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - hospital-network

  # ==========================================
  # SERVICE DISCOVERY: Eureka Naming Server
  # ==========================================
  naming-server:
    build:
      context: ./hospital-management-backend/naming-server/naming-server
      dockerfile: Dockerfile
    container_name: naming-server
    restart: on-failure
    ports:
      - "8761:8761"
    environment:
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=false
      - EUREKA_CLIENT_FETCH_REGISTRY=false
    networks:
      - hospital-network

  # ==========================================
  # API GATEWAY
  # ==========================================
  api-gateway:
    build:
      context: ./hospital-management-backend/api-gateway/api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      - JWT_SECRET=${JWT_SECRET:-HospitalSyncSecretKey2026SecureJwtSigningKeyString}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://naming-server:8761/eureka/
    depends_on:
      - naming-server
    networks:
      - hospital-network

  # ==========================================
  # CORE & DOMAIN MICROSERVICES
  # ==========================================
  auth-service:
    build:
      context: ./hospital-management-backend/auth-service/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    restart: on-failure
    ports:
      - "8086:8086"
    environment:
      - JWT_SECRET=${JWT_SECRET:-HospitalSyncSecretKey2026SecureJwtSigningKeyString}
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/hospital_auth_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=Password
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@hospital.com}
      - ADMIN_NAME=${ADMIN_NAME:-System Administrator}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://naming-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      naming-server:
        condition: service_started
    networks:
      - hospital-network

  patient-service:
    build:
      context: ./hospital-management-backend/patient-service/patient-service
