name: HospitalSync Pro CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. FRONTEND CI: Lint, Vitest Test Suite (64 Tests) & Production Bundle Build
  # ============================================================================
  frontend-ci:
    name: Frontend Test & Build (React 19 + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hospital-management-frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: hospital-management-frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Vitest Unit & Integration Suites (10 Files, 64 Tests)
        run: npm test

      - name: Run Production Bundle Build (Vite)
        run: npm run build

      - name: Upload Production Dist Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: hospital-management-frontend/dist/
          retention-days: 7

  # ============================================================================
  # 2. BACKEND CI: Java 17 + Maven Multi-Microservice Compilation & Tests
  # ============================================================================
  backend-ci:
    name: Backend Build & Test (Java 17 + Spring Boot 3)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: Password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost -u root -pPassword" --health-interval=10s --health-timeout=5s --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Validate Root Maven Compilation
        run: |
          mvn -B clean compile -DskipTests

  # ============================================================================
  # 3. INFRASTRUCTURE & DOCKER COMPOSE VALIDATION
  # ============================================================================
  infra-validation:
    name: Docker Compose & Infrastructure Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration Syntax
        run: |
          docker compose config -q
        env:
          DB_PASSWORD: TestSecurePassword2026!
          JWT_SECRET: HospitalSyncTestSigningKeySecret2026SecureString
